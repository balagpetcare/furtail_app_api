version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: furtail-app-postgres-local
    environment:
      POSTGRES_DB: furtail_app_local
      POSTGRES_USER: furtail_local
      POSTGRES_PASSWORD: local_dev_only_12345
    ports:
      - '5435:5432'
    volumes:
      - furtail-app-postgres-local:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U furtail_local -d furtail_app_local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - furtail-local

volumes:
  furtail-app-postgres-local:
    driver: local

networks:
  furtail-local:
    driver: bridge
